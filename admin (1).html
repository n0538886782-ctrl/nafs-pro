<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تدريب نافس - لوحة المدير</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:12px}
.out{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.panel{background:rgba(255,255,255,.97);border-radius:18px;padding:16px;box-shadow:0 14px 36px rgba(5,30,90,.3);margin-bottom:14px}
.tabs.three{grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.95)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px} .bar>*{flex:1;min-width:120px}
.bar input,.bar select{min-height:42px}
.tw{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid #e1ecfa;white-space:nowrap} th{background:var(--ice);color:var(--navy)}
td.w{white-space:normal;min-width:220px}
.sm{min-height:34px;padding:4px 12px;border-radius:9px;border:1.5px solid var(--royal);background:#fff;color:var(--royal);font:inherit;font-weight:700;cursor:pointer;margin-left:4px}
.sm.red{border-color:var(--bad);color:var(--bad)} .sm.fill{background:var(--royal);color:#fff}
.b{display:inline-block;border-radius:10px;padding:0 10px;font-size:.82rem;font-weight:700}
.b.ok{background:#e6f6ee;color:#0c6b3b} .b.no{background:#fdecec;color:#a62323}
h3{margin:0 0 10px;color:var(--navy)} .btn.in{width:auto;padding:0 22px;margin-top:10px}
textarea{width:100%;min-height:80px;font:inherit;padding:10px 14px;border:2px solid #cfe0f7;border-radius:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px} @media(max-width:600px){.opts{grid-template-columns:1fr}}
.prev img{max-width:160px;border-radius:8px;margin-top:6px}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<div class="wrap">
  <div class="top"><b style="font-size:1.2rem">لوحة المدير - تدريب نافس</b><button class="out" id="out">خروج</button></div>
  <div class="tabs three" id="tabs">
    <button data-t="st" aria-selected="true">الطلاب</button>
    <button data-t="up" aria-selected="false">رفع الأسماء</button>
    <button data-t="q" aria-selected="false">الأسئلة</button>
  </div>

  <!-- الطلاب -->
  <section id="s-st" class="panel">
    <div class="bar">
      <input id="fs" placeholder="بحث بالاسم أو الهوية">
      <select id="fg"><option value="">كل المراحل</option><option value="p6">سادس ابتدائي</option><option value="m3">ثالث متوسط</option></select>
      <select id="fc"><option value="">كل الفصول</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
    </div>
    <p class="hint" id="stCount"></p>
    <div class="tw"><table><thead><tr><th>الاسم</th><th>رقم الهوية</th><th>المرحلة والفصل</th><th>آخر دخول</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="stBody"></tbody></table></div>
  </section>

  <!-- رفع الأسماء -->
  <section id="s-up" class="panel" hidden>
    <h3>رفع أسماء الطلاب</h3>
    <p class="hint">ملف Excel أو CSV أو Word (جدول) بأربعة أعمدة بهذا الترتيب: الاسم، رقم الهوية، المرحلة، الفصل. وخزّن عمود الهوية كنص حتى لا يتغير الرقم.</p>
    <button class="sm" id="tpl">تحميل قالب Excel</button>
    <input type="file" id="file" accept=".xlsx,.xls,.csv,.docx" style="margin-top:10px">
    <div id="preview"></div>
  </section>

  <!-- الأسئلة -->
  <section id="s-q" hidden>
    <form class="panel" id="qf">
      <h3 id="qh">إضافة سؤال</h3><input type="hidden" id="qid"><input type="hidden" id="qurl">
      <div class="row">
        <div><label for="qg">المرحلة</label><select id="qg"><option value="p6">سادس ابتدائي</option><option value="m3">ثالث متوسط</option></select></div>
        <div><label for="qs">المادة</label><select id="qs"><option value="math">رياضيات</option><option value="arabic">لغتي</option><option value="science">علوم</option></select></div>
      </div>
      <label for="qk">المهارة (اختياري)</label><input id="qk" placeholder="مثال: الكسور">
      <label for="qt">نص السؤال</label><textarea id="qt" required></textarea>
      <label for="qimg">صورة للسؤال (اختياري)</label><input type="file" id="qimg" accept="image/*"><div class="prev" id="qprev"></div>
      <label>الخيارات (اكتب خيارين على الأقل)</label>
      <div class="opts">
        <input id="o0" placeholder="أ"><input id="o1" placeholder="ب"><input id="o2" placeholder="ج"><input id="o3" placeholder="د">
      </div>
      <div class="row">
        <div><label for="qc">الإجابة الصحيحة</label><select id="qc"><option value="0">أ</option><option value="1">ب</option><option value="2">ج</option><option value="3">د</option></select></div>
        <div><label style="margin-top:36px;font-weight:400"><input type="checkbox" id="qa" checked style="width:20px;min-height:20px"> السؤال مفعّل</label></div>
      </div>
      <label for="qe">شرح الإجابة (اختياري)</label><input id="qe">
      <button class="btn in" id="qsave">حفظ السؤال</button> <button type="button" class="sm" id="qcancel">إلغاء</button>
    </form>
    <div class="panel">
      <div class="bar">
        <select id="lg"><option value="">كل المراحل</option><option value="p6">سادس ابتدائي</option><option value="m3">ثالث متوسط</option></select>
        <select id="ls"><option value="">كل المواد</option><option value="math">رياضيات</option><option value="arabic">لغتي</option><option value="science">علوم</option></select>
      </div>
      <p class="hint" id="qCount"></p>
      <div class="tw"><table><thead><tr><th>السؤال</th><th>المادة</th><th>المهارة</th><th>الحالة</th><th></th></tr></thead><tbody id="qBody"></tbody></table></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SB = { math: 'رياضيات', arabic: 'لغتي', science: 'علوم' };
const GL = { p6: 'سادس', m3: 'ثالث متوسط' };
const MAXC = { p6: 5, m3: 4 };
const nd = v => String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g, '');
let STU = [], ALLOWED = 0, PRE = [], QS = [];

(function () { let h = ''; for (let i = 0; i < 8; i++) { const s = 30 + Math.random() * 80;
  h += `<i style="width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${16+Math.random()*16}s;animation-delay:${-Math.random()*20}s"></i>`; }
  $('sky').innerHTML = h; })();

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return location.href = 'index.html';
  const { data: p } = await sb.from('profiles').select('role,is_active').eq('id', session.user.id).maybeSingle();
  if (!p || p.role !== 'admin' || !p.is_active) return location.href = 'index.html';
  loadStu(); loadQ();
}
$('out').onclick = async () => { await sb.auth.signOut(); location.href = 'index.html'; };
$('tabs').onclick = e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  ['st', 'up', 'q'].forEach(t => $('s-' + t).hidden = t !== b.dataset.t);
};

/* ===== الطلاب ===== */
async function loadStu() {
  const [{ data: p }, { count }] = await Promise.all([
    sb.from('profiles').select('id,full_name,national_id,grade,class_no,is_active,last_login').eq('role', 'student').order('grade').order('class_no').order('full_name'),
    sb.from('allowed_students').select('*', { count: 'exact', head: true })]);
  STU = p || []; ALLOWED = count || 0; renderStu();
}
function renderStu() {
  const g = $('fg').value, c = $('fc').value, t = $('fs').value.trim();
  const l = STU.filter(s => (!g || s.grade === g) && (!c || s.class_no == c) && (!t || s.full_name.includes(t) || (s.national_id || '').includes(t)));
  $('stCount').textContent = `المعروض ${l.length} | المسجلون ${STU.length} | المعتمدون في القائمة ${ALLOWED}`;
  $('stBody').innerHTML = l.map(s => `<tr><td>${esc(s.full_name)}</td><td>${esc(s.national_id)}</td><td>${GL[s.grade]} ${s.class_no}</td>
    <td>${s.last_login ? new Date(s.last_login).toLocaleString('ar-SA-u-ca-gregory', { dateStyle: 'short', timeStyle: 'short' }) : 'لم يدخل'}</td>
    <td><span class="b ${s.is_active ? 'ok' : 'no'}">${s.is_active ? 'مفعّل' : 'موقوف'}</span></td>
    <td><button class="sm" data-a="pw" data-id="${s.id}">إعادة كلمة المرور</button><button class="sm red" data-a="tg" data-id="${s.id}">${s.is_active ? 'إيقاف' : 'تفعيل'}</button></td></tr>`).join('')
    || '<tr><td colspan="6">لا يوجد طلاب مسجلون بعد.</td></tr>';
}
['fs', 'fg', 'fc'].forEach(i => $(i).oninput = renderStu);
$('stBody').onclick = async e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const s = STU.find(x => x.id === b.dataset.id);
  if (b.dataset.a === 'tg') {
    const { error } = await sb.from('profiles').update({ is_active: !s.is_active }).eq('id', s.id);
    if (error) return alert(error.message); return loadStu();
  }
  if (!confirm(`إعادة تعيين كلمة مرور الطالب ${s.full_name}؟`)) return;
  const { data, error } = await sb.functions.invoke('reset-password', { body: { student_id: s.id } });
  if (error || (data && data.error)) return alert('تعذّرت العملية: ' + ((data && data.error) || error.message) + '\nتأكد من نشر الدالة reset-password في Supabase.');
  alert(`كلمة المرور المؤقتة للطالب ${s.full_name}:\n\n${data.password}\n\nسلّمها للطالب أو ولي أمره. لن تظهر مرة أخرى، وسيُطلب منه تغييرها عند أول دخول.`);
};

/* ===== رفع الأسماء ===== */
$('tpl').onclick = () => {
  const ws = XLSX.utils.aoa_to_sheet([['الاسم', 'رقم الهوية', 'المرحلة', 'الفصل'], ['أحمد محمد', '1234567890', 'سادس ابتدائي', 1], ['خالد علي', '1098765432', 'ثالث متوسط', 2]]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'الطلاب'); XLSX.writeFile(wb, 'قالب_الطلاب.xlsx');
};
const grd = v => /سادس|p6/i.test(String(v ?? '')) ? 'p6' : /ثالث|متوسط|m3/i.test(String(v ?? '')) ? 'm3' : null;
function prep(rows) {
  const seen = new Set(); PRE = [];
  rows.forEach((r, idx) => {
    if (!r || !r.some(x => String(x ?? '').trim())) return;
    const [n, i, g, c] = r, id = nd(i);
    if (idx === 0 && id.length === 0) return;
    const gr = grd(g) || grd(c), cl = parseInt(nd(c)) || 0, name = String(n ?? '').trim(); let err = '';
    if (!name) err = 'الاسم ناقص'; else if (id.length !== 10) err = 'الهوية ليست 10 أرقام';
    else if (seen.has(id)) err = 'هوية مكررة في الملف'; else if (!gr) err = 'المرحلة غير معروفة';
    else if (cl < 1 || cl > MAXC[gr]) err = 'الفصل غير موجود';
    seen.add(id); PRE.push({ name, id, gr, cl, err });
  });
  const ok = PRE.filter(x => !x.err).length;
  $('preview').innerHTML = `<p><b>${ok}</b> صالح، و<b>${PRE.length - ok}</b> فيه أخطاء (لن يُحفظ).</p>
    <div class="tw"><table><thead><tr><th>الاسم</th><th>الهوية</th><th>المرحلة</th><th>الفصل</th><th>الحالة</th></tr></thead><tbody>` +
    PRE.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.id)}</td><td>${x.gr ? GL[x.gr] : '-'}</td><td>${x.cl || '-'}</td>
      <td>${x.err ? `<span class="b no">${x.err}</span>` : '<span class="b ok">صالح</span>'}</td></tr>`).join('') +
    `</tbody></table></div>${ok ? `<button class="btn in" id="upSave">حفظ ${ok} طالباً</button>` : ''}`;
  if (ok) $('upSave').onclick = saveNames;
}
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; let rows;
  try {
    if (f.name.toLowerCase().endsWith('.docx')) {
      const r = await mammoth.convertToHtml({ arrayBuffer: await f.arrayBuffer() });
      rows = [...new DOMParser().parseFromString(r.value, 'text/html').querySelectorAll('tr')].map(tr => [...tr.cells].map(c => c.textContent.trim()));
    } else {
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false });
    }
  } catch (x) { return alert('تعذّرت قراءة الملف. تأكد من تطابقه مع القالب.'); }
  prep(rows);
};
async function saveNames() {
  const list = PRE.filter(x => !x.err).map(x => ({ national_id: x.id, full_name: x.name, grade: x.gr, class_no: x.cl }));
  $('upSave').disabled = true;
  for (let i = 0; i < list.length; i += 300) {
    const { error } = await sb.from('allowed_students').upsert(list.slice(i, i + 300), { onConflict: 'national_id' });
    if (error) { $('upSave').disabled = false; return alert(error.message); }
  }
  alert(`تم حفظ ${list.length} طالباً في القائمة المعتمدة.`); $('preview').innerHTML = ''; $('file').value = ''; loadStu();
}

/* ===== الأسئلة ===== */
async function loadQ() {
  let q = sb.from('questions').select('id,grade,subject,skill,text,active').order('created_at', { ascending: false }).limit(500);
  if ($('lg').value) q = q.eq('grade', $('lg').value); if ($('ls').value) q = q.eq('subject', $('ls').value);
  const { data } = await q; QS = data || [];
  $('qCount').textContent = `عدد الأسئلة المعروضة: ${QS.length} (يلزم 10 أسئلة مفعّلة على الأقل لكل مرحلة ومادة)`;
  $('qBody').innerHTML = QS.map(x => `<tr><td class="w">${esc(x.text.slice(0, 90))}</td><td>${GL[x.grade]} - ${SB[x.subject]}</td><td>${esc(x.skill || '')}</td>
    <td><span class="b ${x.active ? 'ok' : 'no'}">${x.active ? 'مفعّل' : 'موقوف'}</span></td>
    <td><button class="sm" data-a="ed" data-id="${x.id}">تعديل</button><button class="sm red" data-a="del" data-id="${x.id}">حذف</button></td></tr>`).join('')
    || '<tr><td colspan="5">لا توجد أسئلة.</td></tr>';
}
['lg', 'ls'].forEach(i => $(i).onchange = loadQ);
function resetForm() { $('qf').reset(); $('qid').value = ''; $('qurl').value = ''; $('qprev').innerHTML = ''; $('qh').textContent = 'إضافة سؤال'; }
$('qcancel').onclick = resetForm;
$('qf').onsubmit = async e => {
  e.preventDefault();
  const raw = [0, 1, 2, 3].map(i => $('o' + i).value.trim()), c = +$('qc').value;
  if (!raw[c]) return alert('الإجابة الصحيحة يجب أن تكون خياراً مكتوباً.');
  const opts = []; let ci = 0; raw.forEach((v, i) => { if (v) { if (i === c) ci = opts.length; opts.push(v); } });
  if (opts.length < 2) return alert('اكتب خيارين على الأقل.');
  $('qsave').disabled = true;
  try {
    let img = $('qurl').value || null; const f = $('qimg').files[0];
    if (f) {
      const path = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${f.name.split('.').pop()}`;
      const { error } = await sb.storage.from('question-images').upload(path, f);
      if (error) throw new Error('تعذّر رفع الصورة: ' + error.message);
      img = sb.storage.from('question-images').getPublicUrl(path).data.publicUrl;
    }
    const row = { grade: $('qg').value, subject: $('qs').value, skill: $('qk').value.trim() || null, text: $('qt').value.trim(), image_url: img, options: opts, active: $('qa').checked };
    let id = $('qid').value;
    if (id) { const { error } = await sb.from('questions').update(row).eq('id', id); if (error) throw error; }
    else { const { data, error } = await sb.from('questions').insert(row).select('id').single(); if (error) throw error; id = data.id; }
    const { error: e2 } = await sb.from('answer_key').upsert({ question_id: id, correct_option: ci, explanation: $('qe').value.trim() || null });
    if (e2) throw e2;
    resetForm(); loadQ();
  } catch (x) { alert(x.message || 'حدث خطأ'); }
  $('qsave').disabled = false;
};
$('qBody').onclick = async e => {
  const b = e.target.closest('[data-a]'); if (!b) return; const id = b.dataset.id;
  if (b.dataset.a === 'del') {
    if (!confirm('حذف السؤال نهائياً؟ سيُحذف معه أثره في نتائج الطلاب. والأفضل إيقافه بدل حذفه (من التعديل).')) return;
    const { error } = await sb.from('questions').delete().eq('id', id); if (error) return alert(error.message); return loadQ();
  }
  const [{ data: q }, { data: k }] = await Promise.all([sb.from('questions').select('*').eq('id', id).single(), sb.from('answer_key').select('*').eq('question_id', id).maybeSingle()]);
  $('qid').value = id; $('qg').value = q.grade; $('qs').value = q.subject; $('qk').value = q.skill || ''; $('qt').value = q.text;
  [0, 1, 2, 3].forEach(i => $('o' + i).value = q.options[i] || '');
  $('qc').value = k ? k.correct_option : 0; $('qe').value = (k && k.explanation) || ''; $('qa').checked = q.active;
  $('qurl').value = q.image_url || ''; $('qprev').innerHTML = q.image_url ? `<img src="${esc(q.image_url)}" alt="">` : '';
  $('qh').textContent = 'تعديل السؤال'; $('qf').scrollIntoView({ behavior: 'smooth' });
};
init();
</script>
</body>
</html>
