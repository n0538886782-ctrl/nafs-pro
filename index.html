<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تدريب نافس - دخول الطلاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>

<main>
  <section class="card">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#1b5fd6"/>
        <path d="M32 10l6.2 13.4 14.6 1.7-10.9 9.9 3 14.4L32 41.6 19.1 49.4l3-14.4-10.9-9.9 14.6-1.7z" fill="#ffc233"/>
      </svg>
      <h1>تدريب نافس</h1>
      <p>للصف السادس الابتدائي والثالث المتوسط</p>
    </div>

    <!-- الدخول والتسجيل -->
    <div id="authBox">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabLogin" aria-selected="true">دخول</button>
        <button role="tab" id="tabReg" aria-selected="false">حساب جديد</button>
      </div>

      <form id="loginForm" autocomplete="on">
        <label for="lid">رقم الهوية</label>
        <input id="lid" inputmode="numeric" maxlength="10" autocomplete="username" required>
        <label for="lpw">كلمة المرور</label>
        <input id="lpw" type="password" autocomplete="current-password" required>
        <button class="btn" id="loginBtn">دخول</button>
        <div class="msg" id="loginMsg" role="alert"></div>
        <p class="hint">نسيت كلمة المرور؟ اطلب من المدير إعادة تعيينها.</p>
      </form>

      <form id="regForm" class="hidden" autocomplete="off">
        <label for="rname">الاسم الكامل</label>
        <input id="rname" required>
        <label for="rid">رقم الهوية (10 أرقام)</label>
        <input id="rid" inputmode="numeric" maxlength="10" required>
        <div class="row">
          <div><label for="rgrade">المرحلة</label>
            <select id="rgrade" required>
              <option value="">اختر</option>
              <option value="p6">سادس ابتدائي</option>
              <option value="m3">ثالث متوسط</option>
            </select></div>
          <div><label for="rclass">الفصل</label>
            <select id="rclass" required disabled><option value="">اختر المرحلة أولاً</option></select></div>
        </div>
        <p class="hint">إذا كان اسمك ضمن قائمة المدرسة فسيُربط بفصلك تلقائياً.</p>
        <label for="rpw">كلمة المرور (6 خانات فأكثر)</label>
        <input id="rpw" type="password" minlength="6" autocomplete="new-password" required>
        <label for="rpw2">تأكيد كلمة المرور</label>
        <input id="rpw2" type="password" minlength="6" autocomplete="new-password" required>
        <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400">
          <input type="checkbox" id="rok" required style="width:22px;min-height:22px;margin-top:4px">
          <span>أقرّ بموافقة وليّ الأمر على تسجيلي في المنصة.</span>
        </label>
        <button class="btn" id="regBtn">إنشاء الحساب</button>
        <div class="msg" id="regMsg" role="alert"></div>
      </form>
    </div>

    <!-- تغيير كلمة المرور المؤقتة -->
    <form id="changeForm" class="hidden">
      <p style="font-weight:700;margin:6px 0 0">اختر كلمة مرور جديدة قبل المتابعة</p>
      <label for="cpw">كلمة المرور الجديدة</label>
      <input id="cpw" type="password" minlength="6" autocomplete="new-password" required>
      <label for="cpw2">تأكيد كلمة المرور</label>
      <input id="cpw2" type="password" minlength="6" autocomplete="new-password" required>
      <button class="btn" id="changeBtn">حفظ ومتابعة</button>
      <div class="msg" id="changeMsg" role="alert"></div>
    </form>

    <p class="foot">منصة تدريبية مستقلة، وليست تابعة لهيئة تقويم التعليم والتدريب.</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const CLASSES = { p6: 5, m3: 4 };
const LABEL = { p6: 'سادس', m3: 'ثالث متوسط' };

/* خلفية: فقاعات ونجوم */
(function(){
  const sky = $('sky'); let h = '';
  for (let i = 0; i < 14; i++) {
    const s = 30 + Math.random() * 90;
    h += `<i style="width:${s}px;height:${s}px;left:${Math.random()*100}%;--dx:${(Math.random()*80-40).toFixed(0)}px;animation-duration:${14+Math.random()*18}s;animation-delay:${-Math.random()*20}s"></i>`;
  }
  for (let i = 0; i < 16; i++)
    h += `<b style="top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${(Math.random()*3.5).toFixed(1)}s"></b>`;
  sky.innerHTML = h;
})();

/* أدوات */
const toEmail = id => id + '@nafes.local';
const normId = v => v.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g, '');
function say(id, text, ok) { const m = $(id); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); }
function busy(btn, on) { btn.disabled = on; }
['lid', 'rid'].forEach(i => $(i).addEventListener('input', e => e.target.value = normId(e.target.value)));

/* تبديل التبويبات */
function tab(reg) {
  $('loginForm').classList.toggle('hidden', reg);
  $('regForm').classList.toggle('hidden', !reg);
  $('tabLogin').setAttribute('aria-selected', !reg);
  $('tabReg').setAttribute('aria-selected', reg);
}
$('tabLogin').onclick = () => tab(false);
$('tabReg').onclick = () => tab(true);

/* الفصول تتغير حسب المرحلة */
$('rgrade').onchange = e => {
  const g = e.target.value, c = $('rclass');
  c.innerHTML = '<option value="">اختر</option>';
  if (g) for (let n = 1; n <= CLASSES[g]; n++) c.innerHTML += `<option value="${n}">${LABEL[g]} ${n}</option>`;
  c.disabled = !g;
};

/* بعد الدخول: توجيه حسب نوع الحساب */
async function enter() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  const { data: p } = await sb.from('profiles').select('role,is_active').eq('id', user.id).maybeSingle();
  if (!p || !p.is_active) {
    await sb.auth.signOut();
    return say('loginMsg', 'هذا الحساب غير مفعّل. تواصل مع المدير.');
  }
  const { data: must } = await sb.rpc('touch_login');
  if (p.role === 'admin') return location.href = 'admin.html';
  if (must) { $('authBox').classList.add('hidden'); $('changeForm').classList.remove('hidden'); return; }
  location.href = 'student.html';
}

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const id = normId($('lid').value);
  if (id.length !== 10) return say('loginMsg', 'رقم الهوية يجب أن يكون 10 أرقام.');
  busy($('loginBtn'), true);
  const { error } = await sb.auth.signInWithPassword({ email: toEmail(id), password: $('lpw').value });
  busy($('loginBtn'), false);
  if (error) return say('loginMsg', 'رقم الهوية أو كلمة المرور غير صحيحة.');
  enter();
};

$('regForm').onsubmit = async e => {
  e.preventDefault();
  const id = normId($('rid').value), pw = $('rpw').value;
  if (id.length !== 10) return say('regMsg', 'رقم الهوية يجب أن يكون 10 أرقام.');
  if (pw.length < 6) return say('regMsg', 'كلمة المرور يجب ألا تقل عن 6 خانات.');
  if (pw !== $('rpw2').value) return say('regMsg', 'كلمتا المرور غير متطابقتين.');
  busy($('regBtn'), true);
  const { error } = await sb.auth.signUp({
    email: toEmail(id), password: pw,
    options: { data: { full_name: $('rname').value.trim(), grade: $('rgrade').value, class_no: $('rclass').value } }
  });
  busy($('regBtn'), false);
  if (error) {
    const m = /already|registered/i.test(error.message)
      ? 'هذه الهوية مسجلة من قبل. استخدم تبويب "دخول"، أو اطلب من المدير إعادة تعيين كلمة المرور.'
      : 'تعذّر إنشاء الحساب. تأكد أن رقم هويتك ضمن قائمة المدرسة، أو تواصل مع المدير.';
    return say('regMsg', m);
  }
  enter();
};

$('changeForm').onsubmit = async e => {
  e.preventDefault();
  const pw = $('cpw').value;
  if (pw !== $('cpw2').value) return say('changeMsg', 'كلمتا المرور غير متطابقتين.');
  busy($('changeBtn'), true);
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { busy($('changeBtn'), false); return say('changeMsg', 'تعذّر حفظ كلمة المرور. جرّب كلمة أطول.'); }
  await sb.rpc('clear_must_change');
  location.href = 'student.html';
};

/* إن كان الطالب مسجلاً دخوله مسبقاً */
sb.auth.getSession().then(({ data }) => { if (data.session) enter(); });
</script>
</body>
</html>
